<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13407e">
  <title>Сегодня · Кабинет руководителя</title>
  <link rel="icon" href="/static/theme/img/logo.svg">
  <link rel="stylesheet" href="/static/theme/theme.css">
  <link rel="stylesheet" href="/static/cabinet/cabinet.css">
  <script defer src="/static/cabinet/cabinet.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5L3 7.5Zm0 5 9 4.5 9-4.5M3 17.5l9 4.5 9-4.5"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 6 9 7 9-7"/></symbol>
    <symbol id="i-meetings" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v5m10-5v5M3 11h18m-14 4h3m3 0h3"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M3 4q5-1 9 2 4-3 9-2v15q-5-1-9 2-4-3-9-2V4Zm9 2v15"/></symbol>
    <symbol id="i-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 6 0 0 1 16 0v2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m10 4-8 14a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3L14 4a2 2 0 0 0-4 0Z"/><path d="M12 9v5m0 3v.2"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M9 3H4v5m11-5h5v5M4 16v5h5m11-5v5h-5"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="m2 6 2 2 3-4m3 3h11M2 15l2 2 3-4m3 3h11"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8m-8 4h6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm9-9 4 4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 4v16h18M7 16v-4m5 4V7m5 9v-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  </svg>
  <a class="skip" href="#main">Перейти к содержимому</a>
  <header>
    <div class="bar">
      <nav class="t-nav" aria-label="Разделы кабинета">
        <span class="t-brand brand">
          <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"/></svg></span>
          <span>ИИ-помощник</span>
        </span>
        <a href="#today"><svg class="icon" aria-hidden="true"><use href="#i-today"/></svg>Сегодня</a>
        <a href="#mail"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Переписка</a>
        <a href="#meetings"><svg class="icon" aria-hidden="true"><use href="#i-meetings"/></svg>Совещания</a>
        <a href="#memory"><svg class="icon" aria-hidden="true"><use href="#i-memory"/></svg>Память</a>
        <a href="#profile"><svg class="icon" aria-hidden="true"><use href="#i-profile"/></svg>Профиль</a>
        <span class="t-spacer"></span>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section data-section="today" aria-label="Сегодня" hidden></section>
    <section data-section="mail" aria-label="Переписка" hidden></section>
    <section data-section="meetings" aria-label="Совещания" hidden></section>
    <section data-section="memory" aria-label="Память и обучение" hidden></section>
    <section data-section="profile" aria-label="Профиль и метрики" hidden></section>
    <noscript>Включите JavaScript, чтобы открыть кабинет руководителя.</noscript>
  </main>
  <div id="notice" role="status"></div>
</body>
</html>
